name: UI Probe — Submenu Repro (temporary)

# TEMPORARY — see scripts/ui-probe-submenu-test.js for the full rationale.
# Best-effort attempt to reproduce a DropdownMenuSub bug (a submenu closing
# right after opening even though the pointer never left it) on a real
# macOS/WKWebView build, since jsdom and Chromium-based e2e can't reproduce
# whatever WKWebView is doing to its own pointer-event delivery. Never fails
# the build (see the script for why). Delete this workflow alongside the
# script, the temporary Rust commands (get_ui_probe_mode, ui_probe_log) and
# core's UiProbeSubmenuPage.tsx once the bug is diagnosed or ruled out.
#
# Triggers on PRs touching the probe's own files, so it runs on the repro PR
# without needing to merge first — GitHub only lists workflow_dispatch (kept
# below too, for later) once a workflow file exists on the default branch,
# which a PR branch isn't. Once this PR closes, no other PR touches these
# paths, so it stays quiet without needing removal first.
#
# Known limitation: this depends on `cliclick` actually being able to move
# the real OS pointer on the runner. If the hosted macOS runner's session
# doesn't grant that without an Accessibility permission prompt, the probe
# will silently look like "did not reproduce" rather than fail loudly — the
# job log's "UI probe result" section is the thing to actually read.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/ui-probe-submenu-test.js"
      - ".github/workflows/ui-probe-submenu.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Checkout desktop
        uses: actions/checkout@v6
        with:
          path: desktop

      - name: Checkout core
        uses: actions/checkout@v6
        with:
          repository: Simple-Irc-Client/core
          token: ${{ secrets.SIC_PAT }}
          path: core

      - name: Checkout network-rs
        uses: actions/checkout@v6
        with:
          repository: Simple-Irc-Client/network-rs
          token: ${{ secrets.SIC_PAT }}
          path: network-rs

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            core/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> target
            network-rs -> target

      - name: Install cliclick
        run: brew install cliclick

      # Best-effort, never fails the job. Run 34901993557 showed every
      # checkpoint fire correctly (window, page load, React mount, trigger
      # rect self-report) but the submenu never opened despite cliclick
      # moving the pointer to the right coordinates with no error — the
      # textbook symptom of CGEventPost being silently dropped because the
      # calling process lacks Accessibility permission (macOS 10.15+ gates
      # synthetic-input delivery to *other* processes behind it). There's no
      # interactive prompt to click on an ephemeral runner, so this pokes the
      # per-user TCC.db directly instead. Column set is discovered at runtime
      # (PRAGMA table_info) since it has changed across macOS versions, and
      # every failure mode here is caught and logged rather than raised —
      # this is one attempt at a workaround, not a dependency the rest of the
      # job needs to succeed.
      - name: Attempt Accessibility grant for cliclick (best-effort)
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import os, shutil, sqlite3, sys, time

          db_path = os.path.expanduser("~/Library/Application Support/com.apple.TCC/TCC.db")
          cliclick_path = shutil.which("cliclick")
          print(f"cliclick path: {cliclick_path}")
          print(f"TCC.db path: {db_path} (exists={os.path.exists(db_path)})")

          if not cliclick_path or not os.path.exists(db_path):
              print("Prerequisite missing — skipping grant attempt.")
              sys.exit(0)

          conn = None
          try:
              conn = sqlite3.connect(db_path)
              cur = conn.cursor()
              cols = [r[1] for r in cur.execute("PRAGMA table_info(access)").fetchall()]
              print(f"access table columns: {cols}")

              candidate_values = {
                  "service": "kTCCServiceAccessibility",
                  "client": cliclick_path,
                  "client_type": 1,
                  "auth_value": 2,
                  "auth_reason": 4,
                  "auth_version": 1,
                  "flags": 0,
                  "last_modified": int(time.time()),
              }
              insert_cols = [c for c in cols if c in candidate_values]
              insert_vals = [candidate_values[c] for c in insert_cols]
              placeholders = ",".join("?" for _ in insert_cols)
              sql = f"INSERT OR REPLACE INTO access ({','.join(insert_cols)}) VALUES ({placeholders})"
              print(f"Executing: {sql}")
              cur.execute(sql, insert_vals)
              conn.commit()
              print("sqlite3 INSERT succeeded (this only proves the file accepted the write — tccd enforcement is separate and not verifiable from here).")

              for row in cur.execute(
                  "SELECT service, client, auth_value FROM access WHERE client LIKE ?", ("%cliclick%",)
              ):
                  print("verify row:", row)
          except Exception as e:
              print(f"TCC grant attempt failed: {e}")
          finally:
              if conn is not None:
                  conn.close()
          PYEOF
          killall tccd 2>/dev/null || echo "tccd restart skipped (not running under this name, or no permission)"
          echo "Accessibility grant attempt finished (best-effort)."

      - name: Install core dependencies
        working-directory: core
        run: pnpm install --frozen-lockfile

      - name: Build renderer (core/dist)
        working-directory: core
        run: pnpm build

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # A bare `cargo build` binary run outside an .app bundle got a window
      # created (setup() fired) but WKWebView never started loading anything
      # (no page-load-started, ever) — see run 34900584565. WKWebView's
      # WebContent/networking helper processes appear to need real bundle
      # context (Info.plist, bundle identifier) to come up at all. `--debug`
      # keeps this fast (no optimization) while still producing a proper
      # .app through the full bundling pipeline. targets is pinned to `app`:
      # tauri.conf.json's default target list includes `dmg`, and building
      # that consumed the intermediate .app without leaving a copy under
      # bundle/macos (see run 34901628090) — we only need the .app itself.
      - name: Build Tauri bundle (debug)
        working-directory: desktop
        run: pnpm tauri build --debug --config '{"bundle":{"createUpdaterArtifacts":false,"targets":["app"]}}'

      - name: Run submenu repro probe
        working-directory: desktop
        run: |
          # Find the .app by wildcard rather than guessing productName's exact
          # casing/spelling, then take whatever single executable is inside
          # Contents/MacOS — more robust than guessing the binary name too.
          app_bundle=$(find src-tauri/target/debug/bundle -maxdepth 3 -name "*.app" | head -n1)
          echo "Found app bundle: ${app_bundle:-<none>}"
          if [ -z "$app_bundle" ]; then
            echo "No .app bundle found — listing the bundle directory for debugging:"
            find src-tauri/target/debug/bundle -maxdepth 4
            exit 1
          fi
          app_binary=$(find "$app_bundle/Contents/MacOS" -maxdepth 1 -type f | head -n1)
          echo "Resolved app binary: ${app_binary:-<none>}"
          node scripts/ui-probe-submenu-test.js "$app_binary"
