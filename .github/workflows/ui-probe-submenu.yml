name: UI Probe — Submenu Repro (temporary)

# TEMPORARY — see scripts/ui-probe-submenu-test.js for the full rationale.
# Best-effort attempt to reproduce a DropdownMenuSub bug (a submenu closing
# right after opening even though the pointer never left it) on a real
# macOS/WKWebView build, since jsdom and Chromium-based e2e can't reproduce
# whatever WKWebView is doing to its own pointer-event delivery. Never fails
# the build (see the script for why). Delete this workflow alongside the
# script, the temporary Rust commands (get_ui_probe_mode, ui_probe_log) and
# core's UiProbeSubmenuPage.tsx once the bug is diagnosed or ruled out.
#
# Triggers on PRs touching the probe's own files, so it runs on the repro PR
# without needing to merge first — GitHub only lists workflow_dispatch (kept
# below too, for later) once a workflow file exists on the default branch,
# which a PR branch isn't. Once this PR closes, no other PR touches these
# paths, so it stays quiet without needing removal first.
#
# Known limitation: this depends on `cliclick` actually being able to move
# the real OS pointer on the runner. If the hosted macOS runner's session
# doesn't grant that without an Accessibility permission prompt, the probe
# will silently look like "did not reproduce" rather than fail loudly — the
# job log's "UI probe result" section is the thing to actually read.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/ui-probe-submenu-test.js"
      - ".github/workflows/ui-probe-submenu.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Checkout desktop
        uses: actions/checkout@v6
        with:
          path: desktop

      - name: Checkout core
        uses: actions/checkout@v6
        with:
          repository: Simple-Irc-Client/core
          token: ${{ secrets.SIC_PAT }}
          path: core

      - name: Checkout network-rs
        uses: actions/checkout@v6
        with:
          repository: Simple-Irc-Client/network-rs
          token: ${{ secrets.SIC_PAT }}
          path: network-rs

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            core/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> target
            network-rs -> target

      - name: Install cliclick
        run: brew install cliclick

      - name: Install core dependencies
        working-directory: core
        run: pnpm install --frozen-lockfile

      - name: Build renderer (core/dist)
        working-directory: core
        run: pnpm build

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # A bare `cargo build` binary run outside an .app bundle got a window
      # created (setup() fired) but WKWebView never started loading anything
      # (no page-load-started, ever) — see run 34900584565. WKWebView's
      # WebContent/networking helper processes appear to need real bundle
      # context (Info.plist, bundle identifier) to come up at all. `--debug`
      # keeps this fast (no optimization) while still producing a proper
      # .app through the full bundling pipeline.
      - name: Build Tauri bundle (debug)
        working-directory: desktop
        run: pnpm tauri build --debug --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Run submenu repro probe
        working-directory: desktop
        run: |
          # Find the .app by wildcard rather than guessing productName's exact
          # casing/spelling, then take whatever single executable is inside
          # Contents/MacOS — more robust than guessing the binary name too.
          app_bundle=$(find src-tauri/target/debug/bundle -maxdepth 3 -name "*.app" | head -n1)
          echo "Found app bundle: ${app_bundle:-<none>}"
          if [ -z "$app_bundle" ]; then
            echo "No .app bundle found — listing the bundle directory for debugging:"
            find src-tauri/target/debug/bundle -maxdepth 4
            exit 1
          fi
          app_binary=$(find "$app_bundle/Contents/MacOS" -maxdepth 1 -type f | head -n1)
          echo "Resolved app binary: ${app_binary:-<none>}"
          node scripts/ui-probe-submenu-test.js "$app_binary"
